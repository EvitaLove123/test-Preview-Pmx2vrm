<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aster VRM 0.x Export Smoke Test</title>
<style>
body{font:16px system-ui,sans-serif;max-width:760px;margin:32px auto;padding:0 16px;background:#101522;color:#edf2ff}
button{padding:12px 16px;border:0;border-radius:10px;background:#8bb8ff;color:#101522;font-weight:700}
pre{white-space:pre-wrap;background:#1b2638;padding:14px;border-radius:10px}
small{color:#b9c6dc}
</style>
</head>
<body>
<h1>Aster VRM 0.x — smoke test</h1>
<p>Creates a synthetic legacy humanoid, writes extensions.VRM, then reads the result through Three-vrm.</p>
<p><small>Fixture only. It does not validate real PMX skinning, textures, MToon, BlendShape or SpringBone.</small></p>
<button id="run">Run export + read-back test</button>
<pre id="log">Ready.</pre>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { exportVrm0 } from '../src/vrm/three-vrm0-exporter.js';

const log = document.querySelector('#log');
function makeFixture() {
  const scene = new THREE.Scene();
  const root = new THREE.Group();
  root.name = 'AsterVRM0SmokeAvatar';
  scene.add(root);
  const humanoid = {};
  const add = (name, parent, y=0) => {
    const bone = new THREE.Bone();
    bone.name = name;
    bone.position.y = y;
    parent.add(bone);
    humanoid[name] = bone;
    return bone;
  };
  const hips = add('hips', root, 1);
  const spine = add('spine', hips, .2);
  const chest = add('chest', spine, .25);
  const neck = add('neck', chest, .2);
  add('head', neck, .15);
  const lUpperArm = add('leftUpperArm', chest, .2);
  const lLowerArm = add('leftLowerArm', lUpperArm, -.2);
  add('leftHand', lLowerArm, -.2);
  const rUpperArm = add('rightUpperArm', chest, .2);
  const rLowerArm = add('rightLowerArm', rUpperArm, -.2);
  add('rightHand', rLowerArm, -.2);
  const lUpperLeg = add('leftUpperLeg', hips, -.2);
  const lLowerLeg = add('leftLowerLeg', lUpperLeg, -.4);
  add('leftFoot', lLowerLeg, -.4);
  const rUpperLeg = add('rightUpperLeg', hips, -.2);
  const rLowerLeg = add('rightLowerLeg', rUpperLeg, -.4);
  add('rightFoot', rLowerLeg, -.4);
  const geometry = new THREE.CapsuleGeometry(.18, .8, 4, 8);
  const target = geometry.attributes.position.clone();
  for (let i = 0; i < target.count; i++) {
    target.setY(i, target.getY(i) + 0.015);
  }
  geometry.morphAttributes.position = [target];
  const body = new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({color:0x8bb8ff, roughness:1})
  );
  body.name = 'SmokeTestBody';
  body.morphTargetDictionary = {Blink:0};
  body.morphTargetInfluences = [0];
  body.position.y = 1.2;
  root.add(body);
  return {scene, humanoid, body};
}

document.querySelector('#run').addEventListener('click', async () => {
  log.textContent = 'Exporting…';
  try {
    const {scene, humanoid, body} = makeFixture();
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const context = canvas.getContext('2d');
    context.fillStyle = '#8bb8ff';
    context.fillRect(0, 0, 64, 64);
    const thumbnail = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    const result = await exportVrm0(scene, {
      thumbnail,
      humanoid,
      meta: {
        title: 'Aster VRM 0.x Smoke Test',
        author: 'Aster PMX2VRM',
        allowedUserName: 'OnlyAuthor',
        violentUssageName: 'Disallow',
        sexualUssageName: 'Disallow',
        commercialUssageName: 'Disallow',
        licenseName: 'Redistribution_Prohibited'
      },
      blendShapeGroups: [{
        name: 'Blink',
        presetName: 'Blink',
        binds: [{mesh: body, target: 'Blink', weight: 1}],
        isBinary: true
      }]
    });
    log.textContent = JSON.stringify(result.report, null, 2) +
      '\n\nPASS: Three-vrm loaded the generated file as VRM 0.x.';
    const url = URL.createObjectURL(result.blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Aster-VRM0-SmokeTest.vrm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (error) {
    console.error(error);
    log.textContent = 'FAIL: ' + (error?.stack || error);
  }
});
</script>
</body>
</html>
